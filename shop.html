<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var saved = localStorage.getItem('bullburry_theme');
      if (saved) { document.documentElement.setAttribute('data-theme', saved); }
      else { document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop Bullburry — Elevated streetwear. Outerwear, tops, bottoms and accessories built to last.">
  <meta property="og:title" content="Shop — BULLBURRY">
  <meta property="og:type" content="website">
  <title>Shop — BULLBURRY</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="promo-banner" aria-label="Promotional message">
    Free shipping on orders over $200 &nbsp;·&nbsp; New Drop 02 Coming Soon
  </div>

  <div id="header-placeholder"></div>
  <div class="page-transition" aria-hidden="true"></div>

  <main>
    <div class="container">
      <div class="shop-header">
        <h1 class="shop-title">All Products</h1>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar" role="search" aria-label="Product filters">
        <div class="filter-chips" role="group" aria-label="Category filter">
          <button class="chip active" data-category="all">All</button>
          <button class="chip" data-category="outerwear">Outerwear</button>
          <button class="chip" data-category="tops">Tops</button>
          <button class="chip" data-category="bottoms">Bottoms</button>
          <button class="chip" data-category="accessories">Accessories</button>
        </div>

        <div style="display:flex; gap: var(--space-3); flex-wrap: wrap; margin-left: auto;">
          <select class="filter-select" id="color-filter" aria-label="Filter by color">
            <option value="all">All Colors</option>
            <option value="Obsidian">Obsidian</option>
            <option value="Bone">Bone</option>
            <option value="Ash">Ash</option>
            <option value="Bull Berry">Bull Berry</option>
            <option value="Khaki">Khaki</option>
            <option value="Olive">Olive</option>
          </select>

          <select class="filter-select" id="size-filter" aria-label="Filter by size">
            <option value="all">All Sizes</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>

          <select class="filter-select" id="sort-select" aria-label="Sort products">
            <option value="default">Sort: Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A–Z</option>
          </select>
        </div>
      </div>

      <p class="results-count" id="results-count" aria-live="polite">12 products</p>

      <div class="products-grid" id="products-grid" aria-label="Product grid">
        <!-- Rendered by ui.js initProductFilters -->
        <div class="skeleton-card"><div class="skeleton skeleton-image"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-50"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-image"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-50"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-image"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-50"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-image"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line w-50"></div></div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <div class="cart-drawer" role="dialog" aria-label="Shopping cart" aria-modal="true">
    <div class="cart-drawer-header">
      <span class="cart-drawer-title">Your Cart</span>
      <button class="modal-close" aria-label="Close cart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="cart-drawer-body"></div>
    <div class="cart-drawer-footer">
      <div class="shipping-progress">
        <div class="shipping-progress-bar"><div class="shipping-progress-fill" style="width:0%"></div></div>
        <span class="shipping-progress-label">Add $200 for free shipping</span>
      </div>
      <div class="cart-subtotal">
        <span>Subtotal</span>
        <span class="amount">$0.00</span>
      </div>
      <a href="cart.html" class="btn btn-primary btn-full">Checkout</a>
      <a href="shop.html" class="btn btn-ghost btn-full">Continue Shopping</a>
    </div>
  </div>
  <div class="cart-overlay"></div>

  <div class="modal-overlay" id="quick-view-modal" role="dialog" aria-label="Quick product view" aria-modal="true">
    <div class="modal-box">
      <div class="modal-gallery"></div>
      <div class="modal-content"></div>
      <button class="modal-close" aria-label="Close quick view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
